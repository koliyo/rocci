# Origin hybrid Caddy plus live example apps. Merge with compose.hybrid.yml:
#   docker compose -f docker/compose.hybrid.yml -f docker/compose.origin.yml up
# Do not run compose.examples.yml `edge` on the VPS; :8080 is hybrid Caddy.

services:
  live-counter:
    image: rocci-app:live-counter-${ROCCI_IMAGE_TAG:-local}
    build: ${ROCCI_LIVE_COUNTER_CONTEXT:?ROCCI_LIVE_COUNTER_CONTEXT must contain server, assets/, and Dockerfile}
    environment:
      ROC_BASIC_WEBSERVER_HOST: "0.0.0.0"
      ROC_BASIC_WEBSERVER_PORT: "8000"
      DB_PATH: /var/lib/rocci/app.db
    volumes:
      - live-counter-db:/var/lib/rocci
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  datastar:
    image: rocci-app:datastar-${ROCCI_IMAGE_TAG:-local}
    build: ${ROCCI_DATASTAR_CONTEXT:?ROCCI_DATASTAR_CONTEXT must contain server, assets/, and Dockerfile}
    environment:
      ROC_BASIC_WEBSERVER_HOST: "0.0.0.0"
      ROC_BASIC_WEBSERVER_PORT: "8000"
      DB_PATH: /var/lib/rocci/app.db
    volumes:
      - datastar-db:/var/lib/rocci
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  snake:
    image: rocci-app:snake-${ROCCI_IMAGE_TAG:-local}
    build: ${ROCCI_SNAKE_CONTEXT:?ROCCI_SNAKE_CONTEXT must contain server, assets/, and Dockerfile}
    environment:
      ROC_BASIC_WEBSERVER_HOST: "0.0.0.0"
      ROC_BASIC_WEBSERVER_PORT: "8000"
      DB_PATH: /var/lib/rocci/app.db
    volumes:
      - snake-db:/var/lib/rocci
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  cdn:
    volumes:
      - ./cdn/examples.caddy:/etc/caddy/examples.caddy:ro
    depends_on:
      live-counter:
        condition: service_healthy
      datastar:
        condition: service_healthy
      snake:
        condition: service_healthy

volumes:
  live-counter-db:
  datastar-db:
  snake-db:
