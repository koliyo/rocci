name: rocci-static

services:
  cdn:
    image: rocci-cdn:local
    build: ./cdn
    environment:
      ROCCI_HTTP_PORT: "${ROCCI_HTTP_PORT:-8080}"
    volumes:
      - ${ROCCI_DIST:?ROCCI_DIST must be an absolute path to a built Rocdown dist}:/srv:ro
      - ./static/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${ROCCI_HTTP_PORT:-8080}:80"
