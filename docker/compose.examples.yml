name: rocci-example-origins

# Live catalog apps only (hosting = "live"). Docs-only ids are absent.
# Build contexts are directories containing server, assets/, and Dockerfile
# (same shape as compose.app.yml).

services:
  live-counter:
    image: rocci-app:live-counter
    build: ${ROCCI_LIVE_COUNTER_CONTEXT:?ROCCI_LIVE_COUNTER_CONTEXT must contain server, assets/, and Dockerfile}
    environment:
      ROC_BASIC_WEBSERVER_HOST: "0.0.0.0"
      ROC_BASIC_WEBSERVER_PORT: "8000"
      DB_PATH: /var/lib/rocci/app.db
    volumes:
      - live-counter-db:/var/lib/rocci
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  datastar:
    image: rocci-app:datastar
    build: ${ROCCI_DATASTAR_CONTEXT:?ROCCI_DATASTAR_CONTEXT must contain server, assets/, and Dockerfile}
    environment:
      ROC_BASIC_WEBSERVER_HOST: "0.0.0.0"
      ROC_BASIC_WEBSERVER_PORT: "8000"
      DB_PATH: /var/lib/rocci/app.db
    volumes:
      - datastar-db:/var/lib/rocci
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  edge:
    image: rocci-cdn:local
    build: ./cdn
    environment:
      ROCCI_HTTP_PORT: "${ROCCI_HTTP_PORT:-8080}"
    volumes:
      - ./examples/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${ROCCI_HTTP_PORT:-8080}:80"
    depends_on:
      live-counter:
        condition: service_healthy
      datastar:
        condition: service_healthy

volumes:
  live-counter-db:
  datastar-db:
