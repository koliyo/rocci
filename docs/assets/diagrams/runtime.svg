<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 448" role="img">
  <title>rocci run compiles modules, serves HTTP, and lets Datastar morph HTML</title>
  <desc>Standalone apps generate dispatch main.roc; custom apps use authored main.roc. roc compiles to a loopback HTTP origin. The preview window loads that origin. GET view returns a document, POST fragment morphs HTML by id, POST command returns empty SSE or 204, GET live polls a stream. Do not morph the same id from a fragment and a live stream.</desc>
  <style>
      :root {
        color-scheme: dark light;
        --canvas: #282c34;
        --surface: #21252b;
        --ink: #abb2bf;
        --muted: #9da5b4;
        --line: #3e4451;
        --accent: #61afef;
        --accent-soft: #2c313c;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --canvas: #fafafa;
          --surface: #ffffff;
          --ink: #383a42;
          --muted: #696c77;
          --line: #e5e5e6;
          --accent: #4078f2;
          --accent-soft: #eef2fb;
        }
      }
      .bg { fill: var(--canvas); }
      .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.25; }
      .box-hi { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.25; }
      .title { fill: var(--ink); font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 700; }
      .sub { fill: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; font-weight: 500; }
      .mono { fill: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; font-weight: 650; }
      .head { fill: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 750; letter-spacing: 0.06em; }
      .arrow { stroke: var(--accent); stroke-width: 1.5; fill: none; marker-end: url(#arrowHead); }
      #arrowHead path { fill: var(--accent); }
    </style>
  <defs>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 z" />
    </marker>
  </defs>
  <rect class="bg" width="720" height="448" rx="8" />

  <text class="head" x="16" y="22">ROCCI RUN</text>

  <rect class="box-hi" x="16" y="32" width="128" height="58" rx="6" />
  <text class="mono" x="80" y="56" text-anchor="middle">.rocci</text>
  <text class="sub" x="80" y="74" text-anchor="middle">modules</text>

  <path class="arrow" d="M144 61 L160 61" />

  <rect class="box" x="162" y="32" width="128" height="58" rx="6" />
  <text class="title" x="226" y="56" text-anchor="middle">compile</text>
  <text class="sub" x="226" y="74" text-anchor="middle">parse / lower</text>

  <path class="arrow" d="M290 61 L306 61" />

  <rect class="box" x="308" y="32" width="148" height="58" rx="6" />
  <text class="mono" x="382" y="56" text-anchor="middle">main.roc</text>
  <text class="sub" x="382" y="74" text-anchor="middle">generated or authored</text>

  <path class="arrow" d="M456 61 L472 61" />

  <rect class="box" x="474" y="32" width="100" height="58" rx="6" />
  <text class="title" x="524" y="56" text-anchor="middle">roc</text>
  <text class="sub" x="524" y="74" text-anchor="middle">native</text>

  <path class="arrow" d="M574 61 L590 61" />

  <rect class="box-hi" x="592" y="32" width="112" height="58" rx="6" />
  <text class="title" x="648" y="56" text-anchor="middle">HTTP origin</text>
  <text class="sub" x="648" y="74" text-anchor="middle">loopback</text>

  <path class="arrow" d="M648 90 L648 134 L522 134" />

  <rect class="box" x="200" y="112" width="320" height="44" rx="6" />
  <text class="title" x="360" y="130" text-anchor="middle">preview window loads that origin</text>
  <text class="sub" x="360" y="146" text-anchor="middle">Datastar morphs HTML by id. Not a second renderer.</text>

  <text class="head" x="16" y="184">REQUEST SHAPES</text>

  <rect class="box" x="16" y="194" width="164" height="70" rx="6" />
  <text class="mono" x="98" y="218" text-anchor="middle">GET view</text>
  <text class="sub" x="98" y="236" text-anchor="middle">HTML document</text>
  <text class="sub" x="98" y="252" text-anchor="middle">load / navigate</text>

  <rect class="box" x="190" y="194" width="164" height="70" rx="6" />
  <text class="mono" x="272" y="218" text-anchor="middle">POST fragment</text>
  <text class="sub" x="272" y="236" text-anchor="middle">morph HTML by id</text>
  <text class="sub" x="272" y="252" text-anchor="middle">acting tab only</text>

  <rect class="box" x="364" y="194" width="164" height="70" rx="6" />
  <text class="mono" x="446" y="218" text-anchor="middle">POST command</text>
  <text class="sub" x="446" y="236" text-anchor="middle">empty SSE / 204</text>
  <text class="sub" x="446" y="252" text-anchor="middle">no success body</text>

  <rect class="box" x="538" y="194" width="166" height="70" rx="6" />
  <text class="mono" x="621" y="218" text-anchor="middle">GET live</text>
  <text class="sub" x="621" y="236" text-anchor="middle">poll stream</text>
  <text class="sub" x="621" y="252" text-anchor="middle">not the fragment id</text>

  <text class="sub" x="360" y="288" text-anchor="middle">Standalone generates dispatch. Custom starts your main.roc. Durable state stays on the server.</text>

  <text class="head" x="16" y="320">SHIP</text>

  <rect class="box-hi" x="16" y="330" width="336" height="70" rx="6" />
  <text class="mono" x="184" y="358" text-anchor="middle">rocci build --release</text>
  <text class="sub" x="184" y="378" text-anchor="middle">server process + assets/. Not a desktop app.</text>

  <rect class="box" x="368" y="330" width="336" height="70" rx="6" />
  <text class="mono" x="536" y="358" text-anchor="middle">rocci bundle</text>
  <text class="sub" x="536" y="378" text-anchor="middle">ad-hoc macOS .app. Host-native only.</text>

  <text class="sub" x="360" y="428" text-anchor="middle">No production signing or OS installers. Run the server behind your own reverse proxy.</text>
</svg>
