[[query]]
q = "html tags fragments"
expect = "/docs/reference/language/tags/"
group = "syntax"

[[query]]
q = "error boundary"
expect = "/docs/reference/diagnostics/"
group = "runtime"

[[query]]
q = "windows support"
expect = "/docs/reference/compatibility/"
group = "beginner"

[[query]]
q = "one-shot versus live"
expect = "/docs/applications/handlers/"
