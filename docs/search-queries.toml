# Maintained search queries for the Rocci manual.
# Expected routes are canonical pages (aliases also resolve).
# Threshold: every row's `expect` page must exist (`rocci-ops check-docs`).
# Live zero-result search samples are added as new rows after public search exists.
# First-use sessions: docs/reference/contributor/first-use.rocdown

schema_version = 1
product = "rocci"
threshold = "every listed query resolves to an existing page"

[[query]]
q = "what is rocci"
expect = "/docs/start/what-is-rocci/"
group = "beginner"

[[query]]
q = "install rocci"
expect = "/docs/start/install/"
group = "beginner"

[[query]]
q = "@component"
expect = "/docs/reference/language/components/"
group = "syntax"

[[query]]
q = "component body parameter"
expect = "/docs/how-to/author-components/"
group = "beginner"

[[query]]
q = "@if"
expect = "/docs/reference/language/directives/"
group = "syntax"

[[query]]
q = "@match"
expect = "/docs/reference/language/directives/"
group = "syntax"

[[query]]
q = "@patch"
expect = "/docs/reference/language/server/"
group = "runtime"

[[query]]
q = "@command 204"
expect = "/docs/reference/runtime/"
group = "runtime"

[[query]]
q = "@live sse"
expect = "/docs/concepts/one-shot-versus-live/"
group = "runtime"

[[query]]
q = "rocci run --no-window"
expect = "/docs/reference/cli/#run"
group = "cli"

[[query]]
