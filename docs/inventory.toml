# Phase 0 truth map for the Rocci manual.
# Not a public page. Public routes live in .rocdown files; this file records
# dispositions, aliases, generator ownership, and accepted decision gates.

schema_version = 1
product = "rocci"
docs_root = "docs"
site_docs_prefix = "/docs/"

[approvals]
# Accepted with the implementation plan on 2026-08-21.
rocci_first_docs = true
rocdown_lane = "/rocdown/"
nav_labels = [
    "Start",
    "Tutorials",
    "How to",
    "Understand",
    "Reference",
    "Troubleshooting",
    "Status",
]
examples_lane = "/examples/"
install_channel = "source-build"
install_experimental = "github-prerelease-archives"
install_absent = ["crates.io", "homebrew", "install-script"]
version_label = "development"
first_component_example = "examples/rocci/standalone/styling"
first_app_example = "examples/rocci/standalone/counter"
sqlite_in_beginner_path = true
coverage_path = "docs/coverage.toml"
coverage_fail_on = [
    "unowned-current-feature",
    "removed-labeled-current",
    "missing-canonical-page",
]
example_filter_metadata = "examples/rocci/apps.toml"
platform_verified = ["macos", "linux"]
platform_documented_unverified = ["windows"]
new_rocdown_features = false

[vocabulary]
component = "A PascalCase @component that lowers to a pure Roc Html function."
standalone_app = "A .rocci module with @context / @init / @view that rocci run compiles into a generated server."
custom_app = "A directory with authored main.roc that reuses .rocci modules."
patch = "A one-shot HTML fragment response from @patch; Datastar morphs the acting tab."
command = "A @command handler that returns Roc data: empty SSE to Datastar, JSON to other clients."
live = "A module-level @live render that generates GET /sse for shared HTML updates."
datastar = "Browser transport for intent and morphing. Not a client application framework."
rocdown = "Separate Markdown-first document product. Not part of the Rocci learning path."
preview = "The Tao/Wry window that loads the same local HTTP origin as a browser."
rocci_browse = "Component gallery (rocci browse)."

[ownership]
manual = "docs/"
examples_catalog = "examples/rocci/apps.toml"
examples_prose = "examples/rocci/**/index.rocdown"
examples_declaration_docs = "attached ## comments on top-level @ declarations"
examples_source = "checked-in .rocci, authored .roc, rocci.toml, and selected assets"
examples_staged = "dist/example-docs (derived; never edited)"
staging_tool = "crates/rocci-docs"

[install]
primary = "Clone the repository and cargo-build the workspace."
roc_nightly = "nightly-2026-08-10-7df8509"
roc_pin_source = "docker/install-roc.sh"
rust = "A Rust toolchain that compiles edition 2024 workspace crates."
github_releases = "Optional prerelease archives from GitHub Releases (tag v* / dev). Experimental; not the documented first path."

