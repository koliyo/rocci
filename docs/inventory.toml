# Phase 0 truth map for the stack-first Rocci manual.
# Not a public page. Public routes live in .rocdown files; this file records
# dispositions, @page aliases fields to remove, retired routes that will 404,
# generator ownership, and accepted decision gates.
#
# Approval (2026-08-22, confirmed Phase 0; not reopened):
# - Nav labels: Start, Templates, Applications, Rocdown, Reference,
#   Troubleshooting, Appendix.
# - Rocdown lives at /docs/rocdown/. No top-level /rocdown/ lane.
# - Clean-cut URLs: no @page aliases, no vanity prefixes, no redirects.
# - Academy chrome (Kind / Prerequisites / You will / Time / Next) is banned
#   in page bodies.
# - Choose your path is retired; primers are optional appendix.
# - First-use protocol is unpublished.
#
# No alias-preservation section. Old academy, product-lane, and historical
# routes 404. Phase 0 does not move public pages.

schema_version = 1
product = "rocci"
docs_root = "docs"
site_docs_prefix = "/docs/"

[approvals]
recorded = "2026-08-22"
plan = "knowledge/plans/site/rocci-dev-docs-stack-ia.md"
stack_ia = true
rocdown_lane = "/docs/rocdown/"
top_level_rocdown_lane = false
url_aliases = false
academy_chrome = false
choose_your_path = false
first_use_protocol = "unpublished"
nav_labels = [
    "Start",
    "Templates",
    "Applications",
    "Rocdown",
    "Reference",
    "Troubleshooting",
    "Appendix",
]
examples_lane = "/examples/"
playground_lane = "/playground/"
install_channel = "source-build"
install_experimental = "github-prerelease-archives"
install_absent = ["crates.io", "homebrew", "install-script"]
version_label = "development"
first_component_example = "examples/rocci/standalone/styling"
first_app_example = "examples/rocci/standalone/counter"
sqlite_in_beginner_path = true
coverage_path = "docs/coverage.toml"
coverage_fail_on = [
    "unowned-current-feature",
    "removed-labeled-current",
    "missing-canonical-page",
]
example_filter_metadata = "examples/rocci/apps.toml"
platform_verified = ["macos", "linux"]
platform_documented_unverified = ["windows"]
new_rocdown_features = false
five_minutes_route = "/docs/five-minutes/"

# Directory-plus-index sidebar contract
# (knowledge/plans/rocdown/docs-directory-semantics.md Phase 0).
# Phase 5 shipped Overview first child. peel_by stays id.

[directory_semantics]
plan = "knowledge/plans/rocdown/docs-directory-semantics.md"
directory_plus_index = true
overview_first_child = true
peel_by = "id"
nested_index_fold = true
no_index_stays_flat = true
cluster_warning = "RD2205"
cluster_warning_severity = "warning"
explicit_nav = true
visible_depth = 2
indexless_clusters = []

[vocabulary]
component = "A PascalCase @component that lowers to a pure Roc Html function."
standalone_app = "A directory of .rocci modules with at most one process @init / @context, run by rocci run <dir> or rocci run File.rocci."
custom_app = "A directory with authored main.roc that reuses .rocci modules."
applications = "Standalone and custom are two depths of the same layer, not two products."
patch = "A one-shot HTML fragment from @get:fragment or a mutation @method:fragment; Datastar morphs the acting tab."
command = "A mutation @method:command whose {} body has no success representation: empty SSE to Datastar, 204 otherwise."
live = "A path-bearing @get:live fragment stream; modules may declare several streams."
datastar = "Browser transport for intent and morphing. Not a client application framework."
rocdown = "Optional experimental document layer at /docs/rocdown/. Uses templates and applications; not a sibling product lane."
preview = "The Tao/Wry window that loads the same local HTTP origin as a browser."
rocci_browse = "Component gallery (rocci browse)."

[ownership]
manual = "docs/"
examples_catalog = "examples/rocci/apps.toml"
examples_prose = "examples/rocci/**/index.rocdown"
examples_declaration_docs = "attached ## comments on top-level @ declarations"
examples_source = "checked-in .rocci, authored .roc, rocci.toml, and selected assets"
examples_staged = "dist/example-docs (derived; never edited)"
staging_tool = "crates/rocci-docs"

[install]
primary = "Clone the repository and cargo-build the workspace."
roc_nightly = "nightly-2026-08-26-b29bef3"
roc_pin_source = "docker/install-roc.sh"
rust = "A Rust toolchain that compiles edition 2024 workspace crates."
github_releases = "Optional prerelease archives from GitHub Releases (tag v* / dev). Experimental; not the documented first path."

