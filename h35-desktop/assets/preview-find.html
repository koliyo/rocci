<div class="bar" role="search">
  <input
    type="search"
    id="query"
    placeholder="Find"
    autocomplete="off"
    autocorrect="off"
    spellcheck="false"
    aria-label="Find in page"
  />
  <span id="count" class="count" aria-live="polite"></span>
  <button type="button" id="prev" aria-label="Previous match">
    <svg class="icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
      <path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M4 10 8 6l4 4" />
    </svg>
  </button>
  <button type="button" id="next" aria-label="Next match">
    <svg class="icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
      <path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M4 6l4 4 4-4" />
    </svg>
  </button>
  <button type="button" id="close" aria-label="Close find">
    <svg class="icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
      <path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" d="M5 5l6 6M11 5l-6 6" />
    </svg>
  </button>
</div>
