[site]
title = "Rocci"
description = "Build Roc-native interfaces, Markdown-first documents, and small desktop apps without giving up the web platform."
base_url = "https://rocci.dev"
language = "en"
repository = "https://github.com/koliyo/rocci"
social_image = "/assets/og.png"
favicon = "/assets/favicon.svg"
apple_touch_icon = "/assets/apple-touch-icon.png"
subtitle = "Roc-native interface tools"
footer = "Rocci is experimental software. Verify APIs against the current source before production use."

[build]
output = "../dist/rocci.dev"
assets = "assets"
theme = "theme"

[[mount]]
source = "../docs"
prefix = "docs"
layout = "docs"

[[mount]]
source = "../dist/example-docs"
prefix = "examples"
layout = "docs"

[[nav]]
label = "Docs"
directory = "docs"
items = [
    "docs/index",
    "docs/start/what-is-rocci",
    "docs/start/choose-your-path",
    "docs/start/prerequisites",
    "docs/start/install",
    "docs/start/roc-for-rocci",
    "docs/start/web-foundations",
    "docs/start/five-minutes",
    "docs/tutorials/first-component",
    "docs/guides/server-actions",
    "docs/guides/rocdown-pages",
    "docs/guides/docs-components",
    "docs/guides/desktop-app",
    "docs/guides/rocci-browser",
    "docs/concepts/architecture",
    "docs/concepts/why-roc",
    "docs/concepts/rendering-model",
    "docs/reference/rocci",
    "docs/reference/rocdown",
    "docs/reference/cli",
    "docs/reference/configuration",
    "docs/reference/rocdown-site",
    "docs/playground",
    "docs/troubleshooting",
]

[[nav]]
label = "Examples"
directory = "examples"
items = [
    "examples/index",
]

[[nav]]
label = "Rocdown"
directory = "rocdown"
items = [
    "rocdown/index",
]

[[nav]]
label = "News"
directory = "news"
items = [
    "news/index",
    "news/introducing-rocci",
    "news/rocdown-static-collections",
    "news/rocci-desktop-apps",
]

[[nav]]
label = "FAQ"
