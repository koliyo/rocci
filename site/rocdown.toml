[site]
title = "Rocci"
description = "Build Roc-native interfaces, Markdown-first documents, and small desktop apps without giving up the web platform."
base_url = "https://rocci.dev"
language = "en"
repository = "https://github.com/koliyo/rocci"
social_image = "/assets/og.png"
favicon = "/assets/favicon.svg"
apple_touch_icon = "/assets/apple-touch-icon.png"
subtitle = "Composable authoring for applications and content"
footer = "Highly experimental software — for testing only. Not for production use."

[build]
output = "../dist/rocci.dev"
assets = "assets"
theme = "theme"

[[mount]]
source = "../docs"
prefix = "docs"
layout = "docs"

[[mount]]
source = "../dist/example-docs"
prefix = "examples"
layout = "docs"
visibility = "linked-detail"

[[nav]]
label = "Docs"

[[nav.groups]]
label = "Start"
items = [
    "docs/index",
    "docs/install",
    "docs/five-minutes",
    "docs/the-stack",
    "docs/appendix/roc-for-rocci",
    "docs/appendix/web-foundations",
    "docs/appendix/glossary",
]

[[nav.groups]]
label = "Templates"
items = [
    "docs/templates/index",
    "docs/templates/components",
    "docs/templates/markup",
    "docs/templates/directives",
]

[[nav.groups]]
