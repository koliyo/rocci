[workspace]
resolver = "2"
members = [
    "crates/rocci-core",
    "crates/rocci-docs",
    "crates/rocci-desktop",
    "crates/rocci-cli",
    "crates/rocci-template",
    "crates/rocci-ungram",
    "crates/rocci-rocdown",
    "crates/rocci-theme",
    "crates/rocci-highlight",
    "crates/rocci-lsp",
    "crates/rocci-rocdown-cli",
    "crates/rocci-rocdown-lsp",
    "crates/rocci-ui",
    "crates/rocci-roc-host",
    "crates/rocci-wasi-http",
    "crates/rocci-wasi-http-component",
    "crates/rocci-datastar",
    "crates/rocci-playground-spike",
    "crates/rocci-playground",
    "crates/rocci-playground-wasm",
]
exclude = ["editors/zed"]
default-members = ["crates/rocci-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
description = "A Datastar-first .rocci template language and desktop runtime built on tao and wry"

[workspace.dependencies]
rocci-ui = { path = "crates/rocci-ui" }
rocci-roc-host = { path = "crates/rocci-roc-host" }
rocci-wasi-http = { path = "crates/rocci-wasi-http", default-features = false }
rocci-wasi-http-component = { path = "crates/rocci-wasi-http-component" }
rocci-datastar = { path = "crates/rocci-datastar", default-features = false }
rocci-core = { path = "crates/rocci-core" }
rocci-docs = { path = "crates/rocci-docs" }
rocci-desktop = { path = "crates/rocci-desktop" }
h35-desktop = { path = "../h35-desktop" }
rocci-cli = { path = "crates/rocci-cli" }
rocci-template = { path = "crates/rocci-template" }
rocci-ungram = { path = "crates/rocci-ungram" }
rocci-rocdown = { path = "crates/rocci-rocdown" }
rocci-rocdown-cli = { path = "crates/rocci-rocdown-cli" }
rocci-rocdown-lsp = { path = "crates/rocci-rocdown-lsp" }
rocci-playground = { path = "crates/rocci-playground" }
rocci-playground-wasm = { path = "crates/rocci-playground-wasm" }
rocci-theme = { path = "crates/rocci-theme" }
rocci-highlight = { path = "crates/rocci-highlight" }
rocci-lsp = { path = "crates/rocci-lsp" }
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
muda = { version = "0.19.2", default-features = false, features = ["gtk"] }
notify = "8"
serde = { version = "1.0", features = ["derive"] }
tao = "0.36"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "1.1"
tracing = "0.1"
uuid = { version = "1.18", features = ["v4", "js"] }
wry = { version = "0.56", features = ["devtools"] }
rfd = "0.15"

[profile.release]
lto = "thin"
strip = true

[profile.dev.package.comrak]
opt-level = 3

[profile.dev.package.caseless]
opt-level = 3

[profile.dev.package.finl_unicode]
opt-level = 3

[profile.dev.package.jetscii]
opt-level = 3

[profile.dev.package.phf]
opt-level = 3

[profile.dev.package.typed-arena]
opt-level = 3
