[workspace]
resolver = "2"
members = [
    "crates/rocci-core",
    "crates/rocci-wry",
    "crates/rocci-cli",
    "crates/rocci-template",
    "crates/rocci-lsp",
]
exclude = ["editors/zed"]
default-members = ["crates/rocci-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Datastar-first .rocci template language and desktop runtime built on tao and wry"

[workspace.dependencies]
rocci-core = { path = "crates/rocci-core" }
rocci-wry = { path = "crates/rocci-wry" }
rocci-template = { path = "crates/rocci-template" }
rocci-lsp = { path = "crates/rocci-lsp" }
lsp-server = "0.7"
lsp-types = "0.97"
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
muda = "0.19.2"
serde = { version = "1.0", features = ["derive"] }
tao = "0.35"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
uuid = { version = "1.18", features = ["v4"] }
wry = "0.55"

[profile.release]
lto = "thin"
strip = true
