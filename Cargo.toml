[workspace]
resolver = "2"
members = [
    "crates/roc-core",
    "crates/roc-http",
    "crates/roc-wry",
    "crates/roc-cli",
    "crates/roc",
    "examples/counter",
]
default-members = ["examples/counter"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Datastar-first, multi-backend desktop web application runtime built directly on tao and wry"

[workspace.dependencies]
roc-core = { path = "crates/roc-core" }
roc-http = { path = "crates/roc-http" }
roc-wry = { path = "crates/roc-wry" }
roc = { path = "crates/roc" }
anyhow = "1.0"
async-stream = "0.3"
askama = "0.16"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
datastar = { version = "0.3", features = ["axum"] }
futures-util = "0.3"
http = "1.3"
http-body-util = "0.1"
muda = "0.19.2"
serde = { version = "1.0", features = ["derive"] }
tao = "0.35"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4"] }
wry = "0.55"

[profile.release]
lto = "thin"
strip = true
