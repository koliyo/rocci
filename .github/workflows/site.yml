name: Site

on:
  workflow_dispatch:
  push:
    branches: [staging, production]
    paths:
      - "site/**"
      - "docs/**"
      - "examples/**"
      - "docker/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/rocci-ops/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/site.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging' && github.ref != 'refs/heads/production' }}

permissions:
  contents: read

jobs:
  package:
    name: Package site (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install pinned Roc nightly
        run: |
          prefix="$HOME/.local/roc"
          link_dir="$HOME/.local/bin"
          mkdir -p "$prefix" "$link_dir"
          ROC_PREFIX="$prefix" ROC_LINK_DIR="$link_dir" ./docker/install-roc.sh
          echo "$prefix" >> "$GITHUB_PATH"
          echo "$link_dir" >> "$GITHUB_PATH"
      - name: Stage example docs
        run: cargo run -q -p rocci-docs -- --catalog examples/rocci/apps.toml --output dist/example-docs
      - name: Build live example apps
        run: |
          set -euo pipefail
          cargo run -q -p rocci-cli -- build --release \
            examples/rocci/standalone/live-counter/LiveCounter.rocci \
            --target x64musl \
            --output dist/examples-live/live-counter
          cargo run -q -p rocci-cli -- build --release \
            examples/rocci/custom/datastar \
            --target x64musl \
            --output dist/examples-live/datastar
          test -f dist/examples-live/live-counter/server
          test -f dist/examples-live/datastar/server
          test ! -e dist/examples-live/counter
          test ! -e dist/examples-live/snake
          test ! -e dist/examples-live/styling
      - name: Package hybrid site
        run: cargo run -q -p rocci-rocdown-cli -- package site --target x64musl
      - name: Upload linux/amd64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rocci-dev-linux-amd64
          if-no-files-found: error
          path: |
            dist/site.tgz
            dist/islands
            dist/rocci.dev/publish.json
            dist/examples-live/live-counter/server
            dist/examples-live/datastar/server

  deploy:
    name: Push artifacts (${{ github.ref_name }})
    needs: package
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    concurrency:
      group: rocci-dev-origin
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      CF_SSH_HOSTNAME: ssh.rocci.dev
      # ROCCI_SSH_VERBOSE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v8
        with:
          name: rocci-dev-linux-amd64
          path: artifacts
      - name: Show downloaded artifacts
        run: |
          set -euo pipefail
          ls -la artifacts
          test -f artifacts/site.tgz
          test -f artifacts/islands
          wc -c artifacts/site.tgz artifacts/islands
          file artifacts/islands || true
      - name: Install cloudflared
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o "$HOME/.local/bin/cloudflared"
          chmod +x "$HOME/.local/bin/cloudflared"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cloudflared" version || "$HOME/.local/bin/cloudflared" --version
      - name: Write SSH key
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "error: DEPLOY_SSH_KEY is empty" >&2
            exit 1
          fi
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy"
          chmod 600 "$HOME/.ssh/deploy"
          chmod +x docker/prod/access-ssh-proxy.sh
      - name: Probe Access SSH
        run: uv run --no-dev rocci-ops deploy probe
      - name: Push artifacts and publish
        run: uv run --no-dev rocci-ops deploy push artifacts "${GITHUB_SHA}"
