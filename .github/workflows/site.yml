name: Site package

on:
  push:
    paths:
      - "site/**"
      - "docs/**"
      - "docker/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "docker/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/site.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package site (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install pinned Roc nightly
        run: |
          prefix="$HOME/.local/roc"
          link_dir="$HOME/.local/bin"
          mkdir -p "$prefix" "$link_dir"
          ROC_PREFIX="$prefix" ROC_LINK_DIR="$link_dir" ./docker/install-roc.sh
          echo "$link_dir" >> "$GITHUB_PATH"
      - name: Package hybrid site
        run: cargo run -q -p rocci-rocdown-cli -- package site --target x64musl
      - name: Upload linux/amd64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rocci-dev-linux-amd64
          if-no-files-found: error
          path: |
            dist/site.tgz
            dist/islands
            dist/rocci.dev/publish.json
