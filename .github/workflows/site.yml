name: Site

on:
  workflow_dispatch:
  push:
    branches: [staging, production]
    paths:
      - "site/**"
      - "docs/**"
      - "playground/**"
      - "examples/**"
      - "docker/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rocci-ops/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/site.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Package site (linux/amd64)
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Install Linux desktop build deps
        run: sudo ./docker/install-linux-deps.sh builder
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install pinned Roc nightly
        run: |
          prefix="$HOME/.local/roc"
          link_dir="$HOME/.local/bin"
          mkdir -p "$prefix" "$link_dir"
          ROC_PREFIX="$prefix" ROC_LINK_DIR="$link_dir" ./docker/install-roc.sh
          echo "$prefix" >> "$GITHUB_PATH"
          echo "$link_dir" >> "$GITHUB_PATH"
      - name: Package site and live example apps
        run: |
          set -euo pipefail
          uv run --no-dev rocci-ops package site --target x64musl
      - name: Upload linux/amd64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rocci-dev-linux-amd64
          if-no-files-found: error
          path: |
            dist/site.tgz
            dist/islands
            dist/rocci.dev/publish.json
            dist/examples-live/**

  deploy:
    name: Push artifacts (${{ github.ref_name }})
    needs: package
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    concurrency:
      group: rocci-dev-origin
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      CF_SSH_HOSTNAME: ssh.rocci.dev
      ROCCI_LANE: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/download-artifact@v8
        with:
          name: rocci-dev-linux-amd64
          path: artifacts
      - name: Show downloaded artifacts
        run: |
          set -euo pipefail
          ls -la artifacts
          test -f artifacts/site.tgz
          test -f artifacts/islands
          test -d artifacts/examples-live
          wc -c artifacts/site.tgz artifacts/islands
          file artifacts/islands || true
          find artifacts/examples-live -type f | head
      - name: Install cloudflared
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o "$HOME/.local/bin/cloudflared"
          chmod +x "$HOME/.local/bin/cloudflared"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cloudflared" version || "$HOME/.local/bin/cloudflared" --version
      - name: Write SSH key
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "error: DEPLOY_SSH_KEY is empty" >&2
            exit 1
          fi
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy"
          chmod 600 "$HOME/.ssh/deploy"
          chmod +x docker/prod/access-ssh-proxy.sh
      - name: Probe Access SSH
        run: uv run --no-dev rocci-ops deploy probe
      - name: Push artifacts and publish
        run: uv run --no-dev rocci-ops deploy push artifacts "${GITHUB_SHA}"
      - name: Wipe deploy key
        if: always()
        run: |
          set -euo pipefail
          key="$HOME/.ssh/deploy"
          if [ -f "$key" ]; then
            shred -u "$key" 2>/dev/null || rm -f "$key"
          fi
