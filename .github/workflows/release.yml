name: Release

on:
  # Anyone with write can dispatch. After public, a ruleset should restrict v* tags.
  workflow_dispatch:
  push:
    tags: ["v*", "dev"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-hosted
            runner: '["macos-latest"]'
            target: aarch64-apple-darwin
          - os: linux-hosted
            runner: '["ubuntu-latest"]'
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop build deps
        if: runner.os == 'Linux'
        run: sudo ./docker/install-linux-deps.sh builder

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build release binaries
        run: cargo build --release -p rocci-cli -p rocci-rocdown-cli -p rocci-rocdown-lsp

      - name: Determine version
        id: version
        run: uv run --no-dev rocci-ops release version

      - name: Package archive
        id: archive
        run: >
          uv run --no-dev rocci-ops release package
          --version "${{ steps.version.outputs.version }}"
          --target "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.archive }}
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.archive }}.sha256
          retention-days: 7

  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Wait for CI checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-dev rocci-ops release wait-ci

  release:
    name: Publish Release
    needs: [build, ci-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Determine release parameters
        id: params
        run: uv run --no-dev rocci-ops release params

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          uv run --no-dev rocci-ops release publish
          --tag "${{ steps.params.outputs.tag }}"
          --title "${{ steps.params.outputs.name }}"
          --target-sha "${{ github.sha }}"
          --artifact-dir artifacts
          ${{ steps.params.outputs.prerelease == 'true' && '--prerelease' || '' }}
