name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - uses: astral-sh/setup-uv@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build release binaries
        run: cargo build --release -p rocci-cli -p rocci-rocdown-cli -p rocci-rocdown-lsp -p rocci-okf

      - name: Determine version
        id: version
        run: uv run --project tools/rocci-ops --no-dev rocci-ops release version

      - name: Package archive
        id: archive
        run: >
          uv run --project tools/rocci-ops --no-dev rocci-ops release package
          --version "${{ steps.version.outputs.version }}"
          --target "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.archive }}
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.archive }}.sha256
          retention-days: 7

  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Wait for CI checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --project tools/rocci-ops --no-dev rocci-ops release wait-ci

  release:
    name: Publish Release
    needs: [build, ci-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Determine release parameters
        id: params
        run: uv run --project tools/rocci-ops --no-dev rocci-ops release params

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          uv run --project tools/rocci-ops --no-dev rocci-ops release publish
          --tag "${{ steps.params.outputs.tag }}"
          --title "${{ steps.params.outputs.name }}"
          --target-sha "${{ github.sha }}"
          --artifact-dir artifacts
          ${{ steps.params.outputs.prerelease == 'true' && '--prerelease' || '' }}
