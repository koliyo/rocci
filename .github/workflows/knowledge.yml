name: Knowledge

on:
  push:
    branches: [main, staging, production]
    tags: ["v*", "dev"]
  workflow_call:
    inputs:
      lane:
        description: ignored; Knowledge is GitHub-hosted only
        required: false
        type: string
        default: hosted
      pr_number:
        description: PR number when validating a pull request head
        required: false
        type: string
        default: ""
      pr_sha:
        description: Exact PR head SHA when validating a pull request head
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number when validating a pull request head
        required: false
        type: string
      pr_sha:
        description: Exact PR head SHA when validating a pull request head
        required: false
        type: string

concurrency:
  group: knowledge-hosted-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate Knowledge OKF Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ (inputs.pr_number && inputs.pr_sha && format('refs/pull/{0}/head', inputs.pr_number)) || inputs.pr_sha || github.sha }}
          persist-credentials: ${{ !inputs.pr_sha }}
      - name: Pin checkout to snapshot SHA
        if: ${{ inputs.pr_sha }}
        env:
          PR_SHA: ${{ inputs.pr_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$PR_SHA" ]]; then
            git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
              fetch origin "$PR_SHA"
            git checkout --force "$PR_SHA"
          fi
      - uses: actions/checkout@v7
        with:
          repository: koliyo/okmate
          path: .okmate-tool
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !inputs.pr_sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Validate knowledge bundle
        env:
          OKMATE_DIR: ${{ github.workspace }}/.okmate-tool
        run: uv run --no-dev rocci-ops ci knowledge
