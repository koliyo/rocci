name: Knowledge

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Test knowledge implementation
        run: |
          cargo test -p rocs okf --lib
          cargo test -p rocs-cli knowledge_commands_parse
      - name: Validate profile, graph, provenance, freshness, and source drift
        run: |
          mkdir -p target/knowledge-ci
          cargo run -q -p rocs-cli -- knowledge check knowledge --profile rocci --format json > target/knowledge-ci/validation.json
          cargo run -q -p rocs-cli -- knowledge inspect --profile rocci graph knowledge > target/knowledge-ci/graph.json
          cargo run -q -p rocs-cli -- knowledge benchmark knowledge > target/knowledge-ci/retrieval.json
      - name: Verify deterministic publication artifacts
        run: |
          cargo run -q -p rocs-cli -- knowledge build knowledge --output target/knowledge-ci/build-a
          cargo run -q -p rocs-cli -- knowledge build knowledge --output target/knowledge-ci/build-b
          diff -qr target/knowledge-ci/build-a target/knowledge-ci/build-b
