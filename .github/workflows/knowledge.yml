name: Knowledge

on:
  push:
    branches: [main, staging, production]
  workflow_call:
    inputs:
      lane:
        description: hosted or local runner lane
        required: false
        type: string
        default: hosted
      pr_number:
        description: PR number when validating a pull request head
        required: false
        type: string
        default: ""
      pr_sha:
        description: Exact PR head SHA when validating a pull request head
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      lane:
        description: hosted or local runner lane
        required: false
        type: choice
        options: [hosted, local]
        default: hosted
      pr_number:
        description: PR number when validating a pull request head
        required: false
        type: string
      pr_sha:
        description: Exact PR head SHA when validating a pull request head
        required: false
        type: string

concurrency:
  group: knowledge-${{ inputs.lane || 'hosted' }}-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  authorize:
    name: Authorize trusted PR
    if: ${{ inputs.lane == 'local' }}
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Validate PR author, repository, and immutable SHA
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ inputs.pr_sha }}
          TRUSTED_AUTHOR: koliyo
        run: |
          set -euo pipefail
          echo "allowed=false" >> "$GITHUB_OUTPUT"

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ || ! "$PR_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Self-hosted knowledge validation denied: malformed PR number or SHA."
            exit 0
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          author="$(jq -r '.user.login // ""' <<< "$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha // ""' <<< "$pr_json")"

          if [[ "$author" != "$TRUSTED_AUTHOR" ||
                "$head_repo" != "$GITHUB_REPOSITORY" ||
                "$head_sha" != "$PR_SHA" ]]; then
            echo "Self-hosted knowledge validation denied: PR is not an exact same-repository PR authored by ${TRUSTED_AUTHOR}."
            exit 0
          fi

          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "Authorized ${GITHUB_REPOSITORY}#${PR_NUMBER} at ${PR_SHA}."

  validate:
    name: Validate Knowledge OKF Bundle
    needs: authorize
    if: ${{ always() && !cancelled() && (inputs.lane != 'local' || needs.authorize.outputs.allowed == 'true') }}
    runs-on: ${{ inputs.lane == 'local' && fromJSON('["self-hosted", "rocci-macos"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ (inputs.pr_number && inputs.pr_sha && format('refs/pull/{0}/head', inputs.pr_number)) || inputs.pr_sha || github.sha }}
          persist-credentials: ${{ !inputs.pr_sha }}
      - name: Pin checkout to snapshot SHA
        if: ${{ inputs.pr_sha }}
        env:
          PR_SHA: ${{ inputs.pr_sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$PR_SHA" ]]; then
            git fetch --depth=1 origin "$PR_SHA"
            git checkout --force "$PR_SHA"
          fi
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !inputs.pr_sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Validate knowledge bundle
        run: uv run --no-dev rocci-ops ci knowledge
