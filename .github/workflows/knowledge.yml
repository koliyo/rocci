name: Knowledge

on:
  push:
    branches: [main, staging, production]
    tags: ["v*", "dev"]
  workflow_call:
    inputs:
      lane:
        description: ignored; Knowledge is GitHub-hosted only
        required: false
        type: string
        default: hosted
      pr_number:
        description: PR number when validating a pull request head
        required: false
        type: string
        default: ""
      pr_sha:
        description: Exact PR head SHA when validating a pull request head
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number when validating a pull request head
        required: false
        type: string
      pr_sha:
        description: Exact PR head SHA when validating a pull request head
        required: false
        type: string

concurrency:
  group: knowledge-hosted-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate Knowledge OKF Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ (inputs.pr_number && inputs.pr_sha && format('refs/pull/{0}/head', inputs.pr_number)) || inputs.pr_sha || github.sha }}
          persist-credentials: ${{ !inputs.pr_sha }}
      - name: Pin checkout to snapshot SHA
        if: ${{ inputs.pr_sha }}
        env:
          PR_SHA: ${{ inputs.pr_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$PR_SHA" ]]; then
            git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
              fetch origin "$PR_SHA"
            git checkout --force "$PR_SHA"
          fi
      - name: Install released okmate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .github/okmate-version)"
          dest="${RUNNER_TEMP}/okmate-bin"
          mkdir -p "$dest"
          gh release download "$version" --repo koliyo/okmate \
            --pattern 'okmate-x86_64-unknown-linux-gnu' \
            --dir "$dest"
          chmod +x "$dest/okmate-x86_64-unknown-linux-gnu"
          ln -s "$dest/okmate-x86_64-unknown-linux-gnu" "$dest/okmate"
          echo "$dest" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Validate knowledge bundle
        run: uv run --no-dev rocci-ops ci knowledge
