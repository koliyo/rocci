name: CI command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  dispatch:
    name: Queue CI from /ci
    if: >
      github.event.issue.pull_request &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (github.event.comment.body == '/ci' ||
       startsWith(github.event.comment.body, '/ci '))
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch CI and Knowledge on the PR head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr="${{ github.event.issue.number }}"
          ref="$(gh api "repos/${{ github.repository }}/pulls/${pr}" --jq .head.ref)"
          gh workflow run ci.yml --ref "$ref"
          gh workflow run knowledge.yml --ref "$ref"
          gh pr comment "$pr" --body "Queued **CI** and **Knowledge** on \`${ref}\`."
