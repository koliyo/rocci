name: CI

on:
  push:
    branches: [main, staging, production]
  workflow_call:
    inputs:
      lane:
        description: hosted or local runner lane
        required: false
        type: string
        default: hosted
      pr_number:
        description: PR number when validating a pull request head
        required: false
        type: string
        default: ""
      pr_sha:
        description: Exact PR head SHA when validating a pull request head
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      lane:
        description: hosted or local runner lane
        required: false
        type: choice
        options: [hosted, local]
        default: hosted
      pr_number:
        description: PR number when validating a pull request head
        required: false
        type: string
      pr_sha:
        description: Exact PR head SHA when validating a pull request head
        required: false
        type: string

concurrency:
  group: ci-${{ inputs.lane || 'hosted' }}-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  authorize:
    name: Authorize trusted PR
    if: ${{ inputs.lane == 'local' }}
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Validate PR author, repository, and immutable SHA
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ inputs.pr_sha }}
          TRUSTED_AUTHOR: koliyo
        run: |
          set -euo pipefail
          echo "allowed=false" >> "$GITHUB_OUTPUT"

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ || ! "$PR_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Self-hosted CI denied: malformed PR number or SHA."
            exit 0
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          author="$(jq -r '.user.login // ""' <<< "$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha // ""' <<< "$pr_json")"

          if [[ "$author" != "$TRUSTED_AUTHOR" ||
                "$head_repo" != "$GITHUB_REPOSITORY" ||
                "$head_sha" != "$PR_SHA" ]]; then
            echo "Self-hosted CI denied: PR is not an exact same-repository PR authored by ${TRUSTED_AUTHOR}."
            exit 0
          fi

          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "Authorized ${GITHUB_REPOSITORY}#${PR_NUMBER} at ${PR_SHA}."

  lint:
    name: Code Formatting & Lints
    needs: authorize
    if: ${{ always() && !cancelled() && (inputs.lane != 'local' || needs.authorize.outputs.allowed == 'true') }}
    runs-on: ${{ inputs.lane == 'local' && fromJSON('["self-hosted", "rocci-linux"]') || 'ubuntu-latest' }}
    env:
      CARGO_TARGET_DIR: ${{ inputs.lane == 'local' && '/home/nils/.cache/rocci-target' || 'target' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ (inputs.pr_number && inputs.pr_sha && format('refs/pull/{0}/head', inputs.pr_number)) || inputs.pr_sha || github.sha }}
          persist-credentials: ${{ !inputs.pr_sha }}
      - name: Pin checkout to snapshot SHA
        if: ${{ inputs.pr_sha }}
        env:
          PR_SHA: ${{ inputs.pr_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$PR_SHA" ]]; then
            git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
              fetch --depth=1 origin "$PR_SHA"
            git checkout --force "$PR_SHA"
          fi
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-local-path: ${{ inputs.lane == 'local' && runner.os == 'Linux' && '/home/nils/.cache/uv' || runner.temp }}
      - name: Run lint job
        run: uv run --no-dev rocci-ops ci lint

  test:
    name: Test Workspace (${{ matrix.os }})
    needs: authorize
    if: ${{ always() && !cancelled() && (inputs.lane != 'local' || needs.authorize.outputs.allowed == 'true') }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ inputs.lane == 'local' && fromJSON('[{"os":"macos-self-hosted","runner":"[\"self-hosted\", \"rocci-macos\"]"},{"os":"ubuntu-latest","runner":"[\"ubuntu-latest\"]"}]') || fromJSON('[{"os":"ubuntu-latest","runner":"[\"ubuntu-latest\"]"},{"os":"macos-latest","runner":"[\"macos-latest\"]"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ (inputs.pr_number && inputs.pr_sha && format('refs/pull/{0}/head', inputs.pr_number)) || inputs.pr_sha || github.sha }}
          persist-credentials: ${{ !inputs.pr_sha }}
      - name: Pin checkout to snapshot SHA
        if: ${{ inputs.pr_sha }}
        env:
          PR_SHA: ${{ inputs.pr_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$PR_SHA" ]]; then
            git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
              fetch --depth=1 origin "$PR_SHA"
            git checkout --force "$PR_SHA"
          fi
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !inputs.pr_sha && runner.os != 'Linux' }}
        with:
          key: ${{ matrix.os }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-local-path: ${{ inputs.lane == 'local' && runner.os == 'Linux' && '/home/nils/.cache/uv' || runner.temp }}
      - name: Run workspace tests
        env:
          CARGO_TARGET_DIR: ${{ inputs.lane == 'local' && runner.os == 'Linux' && '/home/nils/.cache/rocci-target' || 'target' }}
        run: uv run --no-dev rocci-ops ci test

  fixtures-and-docs:
    name: AST Fixtures & Docs Validation
    needs: authorize
    if: ${{ always() && !cancelled() && (inputs.lane != 'local' || needs.authorize.outputs.allowed == 'true') }}
    runs-on: ${{ inputs.lane == 'local' && fromJSON('["self-hosted", "rocci-linux"]') || 'ubuntu-latest' }}
    env:
      CARGO_TARGET_DIR: ${{ inputs.lane == 'local' && '/home/nils/.cache/rocci-target' || 'target' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ (inputs.pr_number && inputs.pr_sha && format('refs/pull/{0}/head', inputs.pr_number)) || inputs.pr_sha || github.sha }}
          persist-credentials: ${{ !inputs.pr_sha }}
      - name: Pin checkout to snapshot SHA
        if: ${{ inputs.pr_sha }}
        env:
          PR_SHA: ${{ inputs.pr_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$PR_SHA" ]]; then
            git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
              fetch --depth=1 origin "$PR_SHA"
            git checkout --force "$PR_SHA"
          fi
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-local-path: ${{ inputs.lane == 'local' && '/home/nils/.cache/uv' || runner.temp }}
      - name: Inspect fixtures and validate docs
        run: uv run --no-dev rocci-ops ci fixtures-and-docs

  editors:
    name: Editor Extensions (VS Code & Zed)
    needs: authorize
    if: ${{ always() && !cancelled() && (inputs.lane != 'local' || needs.authorize.outputs.allowed == 'true') }}
    runs-on: ${{ inputs.lane == 'local' && fromJSON('["self-hosted", "rocci-macos"]') || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ (inputs.pr_number && inputs.pr_sha && format('refs/pull/{0}/head', inputs.pr_number)) || inputs.pr_sha || github.sha }}
          persist-credentials: ${{ !inputs.pr_sha }}
      - name: Pin checkout to snapshot SHA
        if: ${{ inputs.pr_sha }}
        env:
          PR_SHA: ${{ inputs.pr_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$PR_SHA" ]]; then
            git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
              fetch --depth=1 origin "$PR_SHA"
            git checkout --force "$PR_SHA"
          fi
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !inputs.pr_sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Run editor checks
        run: uv run --no-dev rocci-ops ci editors
