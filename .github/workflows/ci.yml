name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Code Formatting & Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Check workspace dependency direction
        run: python3 scripts/check-workspace-deps.py
      - name: Check generated AST is current
        run: cargo run -q -p rocci-ungram -- check
      - name: Check code formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test Workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Run doc tests
        run: cargo test --workspace --doc

  fixtures-and-docs:
    name: AST Fixtures & Docs Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Inspect AST syntax fixtures
        run: |
          cargo run -q -p rocci-cli -- inspect --ast test/AllSyntax.rocci
          cargo run -q -p rocci-rocdown-cli -- inspect ast test/AllSyntax.rocdown
          cargo run -q -p rocci-cli -- inspect --ast test/EmbeddedLanguages.rocci
          cargo run -q -p rocci-rocdown-cli -- inspect ast test/EmbeddedLanguages.rocdown
      - name: Validate site and documentation catalog
        run: |
          cargo run -q -p rocci-rocdown-cli -- check site
          cargo run -q -p rocci-rocdown-cli -- check docs

  editors:
    name: Editor Extensions (VS Code & Zed)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Build composed language server
        run: cargo build -p rocci-rocdown-lsp
      - name: Lint and compile VS Code extension
        run: |
          npm --prefix editors/vscode ci
          npm --prefix editors/vscode run lint
          npm --prefix editors/vscode run compile
          npm --prefix editors/vscode run vscode:prepublish
      - name: Run VS Code extension-host tests
        run: npm --prefix editors/vscode test
      - name: Check Zed extension (WebAssembly)
        run: |
          cargo check --manifest-path editors/zed/Cargo.toml --target wasm32-wasip1
          cargo check --manifest-path editors/zed/Cargo.toml
      - name: Verify Zed extension manifest and language server
        run: ./scripts/test-zed-extension.sh
