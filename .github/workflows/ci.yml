name: CI

on:
  workflow_call:
    inputs:
      pr_number:
        description: PR number to validate and test on trusted self-hosted runners
        required: true
        type: string
      pr_sha:
        description: Exact PR head SHA returned by GitHub
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  authorize:
    name: Authorize trusted PR
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Validate PR author, repository, and immutable SHA
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ inputs.pr_sha }}
          TRUSTED_AUTHOR: koliyo
        run: |
          set -euo pipefail
          echo "allowed=false" >> "$GITHUB_OUTPUT"

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ || ! "$PR_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Self-hosted CI denied: malformed PR number or SHA."
            exit 0
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          author="$(jq -r '.user.login // ""' <<< "$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha // ""' <<< "$pr_json")"

          if [[ "$author" != "$TRUSTED_AUTHOR" ||
                "$head_repo" != "$GITHUB_REPOSITORY" ||
                "$head_sha" != "$PR_SHA" ]]; then
            echo "Self-hosted CI denied: PR is not an exact same-repository PR authored by ${TRUSTED_AUTHOR}."
            exit 0
          fi

          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "Authorized ${GITHUB_REPOSITORY}#${PR_NUMBER} at ${PR_SHA}."

  lint:
    name: Code Formatting & Lints
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: [self-hosted, rocci-linux]
    env:
      CARGO_TARGET_DIR: /home/nils/.cache/rocci-target
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
        with:
          cache-local-path: ${{ runner.os == 'Linux' && '/home/nils/.cache/uv' || runner.temp }}
      - name: Run lint job
        run: uv run --no-dev rocci-ops ci lint

  test:
    name: Test Workspace (${{ matrix.os }})
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-self-hosted
            runner: '["self-hosted", "rocci-macos"]'
          - os: ubuntu-latest
            runner: '["ubuntu-latest"]'
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ inputs.pr_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux'
        with:
          key: ${{ matrix.os }}
      - uses: astral-sh/setup-uv@v6
        with:
          cache-local-path: ${{ runner.os == 'Linux' && '/home/nils/.cache/uv' || runner.temp }}
      - name: Run workspace tests
        env:
          CARGO_TARGET_DIR: ${{ runner.os == 'Linux' && '/home/nils/.cache/rocci-target' || 'target' }}
        run: uv run --no-dev rocci-ops ci test

  fixtures-and-docs:
    name: AST Fixtures & Docs Validation
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: [self-hosted, rocci-linux]
    env:
      CARGO_TARGET_DIR: /home/nils/.cache/rocci-target
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          cache-local-path: /home/nils/.cache/uv
      - name: Inspect fixtures and validate docs
        run: uv run --no-dev rocci-ops ci fixtures-and-docs

  editors:
    name: Editor Extensions (VS Code & Zed)
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: [self-hosted, rocci-macos]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Run editor checks
        run: uv run --no-dev rocci-ops ci editors
