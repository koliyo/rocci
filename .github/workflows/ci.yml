name: CI

on:
  push:
    branches: [main, staging, production]
    tags: ["v*", "dev"]
  workflow_call:
    inputs:
      lane:
        description: ignored; CI is GitHub-hosted only
        required: false
        type: string
        default: hosted
      pr_number:
        description: PR number when validating a pull request head
        required: false
        type: string
        default: ""
      pr_sha:
        description: Exact PR head SHA when validating a pull request head
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number when validating a pull request head
        required: false
        type: string
      pr_sha:
        description: Exact PR head SHA when validating a pull request head
        required: false
        type: string

concurrency:
  group: ci-hosted-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Code Formatting & Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ (inputs.pr_number && inputs.pr_sha && format('refs/pull/{0}/head', inputs.pr_number)) || inputs.pr_sha || github.sha }}
          persist-credentials: ${{ !inputs.pr_sha }}
      - name: Pin checkout to snapshot SHA
        if: ${{ inputs.pr_sha }}
        env:
          PR_SHA: ${{ inputs.pr_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$PR_SHA" ]]; then
            git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
              fetch --depth=1 origin "$PR_SHA"
            git checkout --force "$PR_SHA"
          fi
      - name: Install Linux desktop build deps
        run: sudo ./docker/install-linux-deps.sh builder
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Run lint job
        run: uv run --no-dev rocci-ops ci lint

  roc:
    name: Roc-gated crate tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ (inputs.pr_number && inputs.pr_sha && format('refs/pull/{0}/head', inputs.pr_number)) || inputs.pr_sha || github.sha }}
          persist-credentials: ${{ !inputs.pr_sha }}
      - name: Pin checkout to snapshot SHA
        if: ${{ inputs.pr_sha }}
        env:
          PR_SHA: ${{ inputs.pr_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$PR_SHA" ]]; then
            git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
              fetch --depth=1 origin "$PR_SHA"
            git checkout --force "$PR_SHA"
          fi
          git lfs pull
      - name: Install Linux desktop build deps
        run: sudo ./docker/install-linux-deps.sh builder
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Run Roc-gated tests
        run: uv run --no-dev rocci-ops ci roc
      - name: Upload rocci-platform bundle
        uses: actions/upload-artifact@v7
        with:
          name: rocci-platform
          path: |
            crates/rocci-platform/rocci-platform.tar.zst
            crates/rocci-platform/rocci-platform.tar.zst.sha256
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test Workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ (inputs.pr_number && inputs.pr_sha && format('refs/pull/{0}/head', inputs.pr_number)) || inputs.pr_sha || github.sha }}
          persist-credentials: ${{ !inputs.pr_sha }}
      - name: Pin checkout to snapshot SHA
        if: ${{ inputs.pr_sha }}
        env:
          PR_SHA: ${{ inputs.pr_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$PR_SHA" ]]; then
            git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
              fetch --depth=1 origin "$PR_SHA"
            git checkout --force "$PR_SHA"
          fi
      - name: Install Linux desktop build deps
        if: runner.os == 'Linux'
        run: sudo ./docker/install-linux-deps.sh builder
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !inputs.pr_sha && runner.os != 'Linux' }}
        with:
          key: ${{ matrix.os }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Run workspace tests
        run: uv run --no-dev rocci-ops ci test

  fixtures-and-docs:
    name: AST Fixtures & Docs Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ (inputs.pr_number && inputs.pr_sha && format('refs/pull/{0}/head', inputs.pr_number)) || inputs.pr_sha || github.sha }}
          persist-credentials: ${{ !inputs.pr_sha }}
      - name: Pin checkout to snapshot SHA
        if: ${{ inputs.pr_sha }}
        env:
          PR_SHA: ${{ inputs.pr_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$PR_SHA" ]]; then
            git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
              fetch --depth=1 origin "$PR_SHA"
            git checkout --force "$PR_SHA"
          fi
      - name: Install Linux desktop build deps
        run: sudo ./docker/install-linux-deps.sh builder
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Inspect fixtures and validate docs
        run: uv run --no-dev rocci-ops ci fixtures-and-docs

  editors:
    name: Editor Extensions (VS Code & Zed)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ (inputs.pr_number && inputs.pr_sha && format('refs/pull/{0}/head', inputs.pr_number)) || inputs.pr_sha || github.sha }}
          persist-credentials: ${{ !inputs.pr_sha }}
      - name: Pin checkout to snapshot SHA
        if: ${{ inputs.pr_sha }}
        env:
          PR_SHA: ${{ inputs.pr_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$PR_SHA" ]]; then
            git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
              fetch --depth=1 origin "$PR_SHA"
            git checkout --force "$PR_SHA"
          fi
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !inputs.pr_sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Run editor checks
        run: uv run --no-dev rocci-ops ci editors
