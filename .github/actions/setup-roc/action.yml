name: Install the pinned Roc compiler
description: Install the exact new-compiler nightly selected by this repository

runs:
  using: composite
  steps:
    - name: Resolve the Roc nightly
      id: roc-version
      shell: bash
      run: |
        set -euo pipefail

        version_file="$GITHUB_WORKSPACE/.roc-version"
        if [[ ! -f "$version_file" ]]; then
          echo "Missing Roc version file: $version_file"
          exit 1
        fi
        nightly_tag="$(sed 's/\r$//' "$version_file")"
        if [[ ! "$nightly_tag" =~ ^nightly-[0-9]{4}-([A-Za-z]+|[0-9]{2})-[0-9]{2}-[0-9a-f]{7}$ ]]; then
          echo "Invalid Roc nightly tag in $version_file: $nightly_tag"
          exit 1
        fi
        echo "Installing Roc $nightly_tag from .roc-version"

        printf 'nightly-tag=%s\n' "$nightly_tag" >> "$GITHUB_OUTPUT"

    - uses: lukewilliamboswell/setup-roc@89a8a2945bd107f27b160096b3af7f52d2d78369
      with:
        version: nightly-new-compiler
        nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}
