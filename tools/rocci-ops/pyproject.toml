[project]
name = "rocci-ops"
version = "0.1.0"
description = "CI, deploy, and maintainer commands for the Rocci repository."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rocci-ops = "rocci_ops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rocci_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
