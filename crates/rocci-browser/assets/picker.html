<div class="backdrop" id="backdrop">
  <div class="palette" role="dialog" aria-modal="true" aria-label="Open target">
    <input type="search" id="query" placeholder="Open target" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Open target" aria-controls="results"/>
    <ul id="results" role="listbox" aria-label="Matching targets"></ul>
    <p id="empty" class="empty" hidden>No matching targets</p>
    <p class="hint">Enter opens · Tab lists documents · Esc closes</p>
  </div>
</div>
