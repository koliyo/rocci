[package]
name = "rocci-platform"
version.workspace = true
edition = "2021"
rust-version = "1.97"
license = "UPL-1.0"
description = "Roc platform host for Rocci apps (adapted basic-webserver 0.16 native HTTP/SSE/SQLite host)"

[lib]
name = "host"
crate-type = ["staticlib", "rlib"]

[features]
benchmark-driver = []
benchmark-instrumentation = []
benchmark-simulation = ["benchmark-instrumentation"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(no_roc_std_helpers)"] }
dead_code = "allow"
unused = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }

[dependencies]
libc = "0.2.172"
libsqlite3-sys = { version = "0.30.1", features = ["bundled"] }
bytes = "1.11"
brotli = "8.0"
cap-primitives = "4.0"
flate2 = "1.1"
zstd = { version = "0.13", default-features = false }
futures = "0.3"
h2 = "0.4"
hyper = { version = "1.6", features = ["http1", "http2", "client", "server"] }
http-body-util = "0.1"
httpdate = "1.0"
hyper-util = { version = "0.1.12", features = ["tokio", "client", "client-legacy", "server", "server-auto", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "webpki-tokio", "ring"] }
rustls = { version = "0.23", default-features = false }
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["rt", "rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-service = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
