# Maps Rocdown.AST.ungram productions onto shipped types.
# Language crates do not parse this at runtime. `super::MdNode` is the opaque
# Markdown tree defined beside generated types in ast.rs.

[meta]
ungram = "Rocdown.AST.ungram"
uses = [
    "super::MdNode",
    "rocci_template::ComponentPath",
    "rocci_template::{ComponentDecl, ContextDecl, CssDecl, FixtureDecl, InitDecl, OnDecl, Span, TemplateItem}",
]

# Emit a struct or enum matching `rust`.
[generated]
Document = "rocci_rocdown::Document"
Item = "rocci_rocdown::Item"
PageDecl = "rocci_rocdown::PageDecl"
RocDecl = "rocci_rocdown::RocDecl"
RenderDecl = "rocci_rocdown::RenderDecl"
UseDecl = "rocci_rocdown::UseDecl"
BlockCall = "rocci_rocdown::BlockCall"
BracketRecord = "rocci_rocdown::BracketRecord"
BracketList = "rocci_rocdown::BracketList"
ParamField = "rocci_rocdown::ParamField"
ParamValue = "rocci_rocdown::ParamValue"
BlockContent = "rocci_rocdown::BlockContent"
LineContent = "rocci_rocdown::LineContent"
BraceSection = "rocci_rocdown::BraceSection"
EndSection = "rocci_rocdown::EndSection"
EndMarker = "rocci_rocdown::EndMarker"

# Do not emit; use the named type from rocci-template.
[foreign]
ComponentDecl = "rocci_template::ComponentDecl"
FixtureDecl = "rocci_template::FixtureDecl"
CssDecl = "rocci_template::CssDecl"
ContextDecl = "rocci_template::ContextDecl"
InitDecl = "rocci_template::InitDecl"
OnDecl = "rocci_template::OnDecl"
TemplateItem = "rocci_template::TemplateItem"
ComponentPath = "rocci_template::ComponentPath"

# Generated from Rocdown.Markdown.ungram into md.generated.rs. Opaque to this document ungram.
[opaque]
MdNode = "rocci_rocdown::MdNode"

# Human grammar / target article layer. Not a runtime type.
# Do not invent Item::Paragraph.
[doc_only]
ModuleItem = "grouping of language islands; Item lists those payloads directly"
Block = "target article layer; runtime Markdown is Item::Markdown(MdNode)"
Paragraph = "Comrak/MdNode; not constructed"
List = "Comrak/MdNode; not constructed"
ListItem = "Comrak/MdNode; not constructed"
BlockQuote = "Comrak/MdNode; not constructed"
CodeBlock = "Comrak/MdNode; not constructed"
Table = "Comrak/MdNode; not constructed"
TableRow = "Comrak/MdNode; not constructed"
TableCell = "Comrak/MdNode; not constructed"
ThematicBreak = "Comrak/MdNode; not constructed"
Inline = "Comrak inline tree; LineContent does not store inlines"
TemplateSplice = "source shape for Item::Template(TemplateItem)"
HtmlIsland = "source shape for Item::Template(TemplateItem)"

# Leaf `Name = 'token'` rust types. Do not guess.
# Rocdown Ident is not rocci_template::Ident.
[leaves]
BracePayload = "Span"
ParenPayload = "Span"
Ident = "{ name: String, span: Span }"
StringLit = "{ value: String, span: Span }"
BoolLit = "{ value: bool, span: Span }"
NumberLit = "{ value: String, span: Span }"
LineContent = "Span"

[item_variants]
MdNode = "Markdown"
PageDecl = "Page"
RocDecl = "Roc"
RenderDecl = "Render"
ComponentDecl = "Component"
FixtureDecl = "Fixture"
CssDecl = "Css"
ContextDecl = "Context"
InitDecl = "Init"
OnDecl = "On"
UseDecl = "Use"
TemplateItem = "Template"
BlockCall = "Block"

[param_value_variants]
StringLit = "StringLit"
BoolLit = "BoolLit"
NumberLit = "NumberLit"
Ident = "Ident"
BracketRecord = "Record"
BracketList = "List"

[extra]
"ParamField.span" = "omitted; shipped ParamField has no overall span"
"BlockCall.name" = "String + name_span from Ident"
"ParamField.name" = "String + name_span from Ident"
"UseDecl.path" = "String + path_span from StringLit"
"PageDecl.body" = "Span from BracePayload"
"RocDecl.body" = "Span from BracePayload"
"RenderDecl.args" = "Span from ParenPayload"
"LineContent.inlines" = "not stored; LineContent is an opaque span"
"BraceSection.blocks" = "not stored; nested items reparsed via parse_fragment"
"EndSection.blocks" = "not stored; nested items reparsed via parse_fragment"

[block_content_variants]
LineContent = "Line"
BraceSection = "Brace"
EndSection = "End"

[flatten]
"BlockCall.name" = "name:String, name_span:Span"
"ParamField.name" = "name:String, name_span:Span"
"UseDecl.path" = "path:String, path_span:Span"
"EndMarker.name" = "name:String"

[omit_span]
ParamField = true

[span_method]
TemplateItem = true
MdNode = true

[out_of_tree]
PageMeta = "analysis type; not a parse node"
HeadingInfo = "analysis type; not a parse node"
LinkInfo = "analysis type; not a parse node"

# Inspect heads emitted by format_ast. Tags that are not the production name
# must be listed here. pprint.rs owns Writer, truncation, and nested reparse.
[inspect.tags]
Document = "rocdown"
PageDecl = "page"
RocDecl = "roc"
RenderDecl = "render"
ComponentDecl = "component"
FixtureDecl = "fixture"
CssDecl = "css"
ContextDecl = "context"
InitDecl = "init"
OnDecl = "on"
UseDecl = "use"
BlockCall = "block"
"TemplateItem.If" = "if"
"TemplateItem.For" = "for"
"TemplateItem.Match" = "match"
"TemplateItem.Let" = "let"
"TemplateItem.ComponentCall" = "call"
"TemplateItem.Element" = "element"
"TemplateItem.Fragment" = "fragment"
"MdNode.Heading" = "h"
"MdNode.Paragraph" = "p"
"MdNode.Text" = "text"
"MdNode.Code" = "code"
"MdNode.CodeBlock" = "fence"
"MdNode.Link" = "a"
# Ordered lists print `ol`; unordered print `ul`. Overlay chooses the head.
"MdNode.List" = "ul"
"MdNode.Item" = "li"
"MdNode.Emph" = "em"
"MdNode.Strong" = "strong"

[inspect.omit]
Item = "enum wrapper; variants print their own heads"
BracketRecord = "flattened onto block param atoms"
BracketList = "flattened onto param atoms"
ParamField = "flattened onto block param atoms"
ParamValue = "flattened onto block param atoms"
BlockContent = "scope name is an atom; nested items are reparsed"
LineContent = "opaque span; nested items are reparsed"
BraceSection = "nested items are reparsed; no inspect head"
EndSection = "nested items are reparsed; no inspect head"
EndMarker = "flattened onto EndSection"

[inspect.fallback]
MdNode = "md"
TemplateItem = "template"

[inspect.overlay]
MdNode = "write_md"
PageDecl = "write_page"
RocDecl = "write_roc_decl"
RenderDecl = "write_render"
ComponentDecl = "write_component_leaf"
FixtureDecl = "write_fixture_leaf"
CssDecl = "write_css_leaf"
ContextDecl = "write_context_leaf"
InitDecl = "write_init_leaf"
OnDecl = "write_on_leaf"
UseDecl = "write_use"
TemplateItem = "write_template_island"
BlockCall = "write_block"
ParamValue = "write_block"
BlockContent = "write_block"

[highlight.omit]
ParamField = "param-tree internal; painted via BlockCall fields"
ParamValue = "param-tree internal"
BracketRecord = "param-tree internal"
BracketList = "param-tree internal"
LineContent = "opaque nested-item hole"
BraceSection = "opaque nested-item hole"
EndSection = "marker painted as EndMarker"
