[package]
name = "rocci-rocdown"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parse, compile, lower, and generate sites from .rocdown Markdown documents"

[lib]
name = "rocci_rocdown"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
comrak = { version = "0.54", default-features = false }
lsp-types = { workspace = true }
notify = "8"
rocci-core = { workspace = true }
rocci-highlight = { workspace = true }
rocci-lsp = { workspace = true }
rocci-template = { workspace = true }
rocci-theme = { workspace = true }
rocci-ui = { workspace = true }
rocci-roc-host = { workspace = true, features = ["wasmtime"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
toml = { workspace = true }
