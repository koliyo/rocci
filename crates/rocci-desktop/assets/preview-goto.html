<div class="backdrop" id="backdrop">
  <div class="palette" role="dialog" aria-modal="true" aria-label="Go to file">
    <input
      type="search"
      id="query"
      placeholder="Go to file"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
      aria-label="Go to file"
      aria-controls="results"
    />
    <ul id="results" role="listbox" aria-label="Matching documents"></ul>
    <p id="empty" class="empty" hidden>No matching documents</p>
  </div>
</div>
