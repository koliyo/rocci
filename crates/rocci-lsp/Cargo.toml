[package]
name = "rocci-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generic language-server core and Rocci analyzer for .rocci templates"

[lib]
name = "rocci_lsp"
path = "src/lib.rs"

[dependencies]
lsp-server = { workspace = true }
lsp-types = { workspace = true }
rocci-datastar = { workspace = true }
rocci-highlight = { workspace = true }
rocci-template = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tree-sitter = "0.22.6"
