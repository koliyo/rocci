[package]
name = "rocci-rocdown-lsp"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Product language-server binary that composes Rocci and Rocdown analyzers"

[lib]
name = "rocci_rocdown_lsp"
path = "src/lib.rs"

[[bin]]
name = "rocci-language-server"
path = "src/main.rs"

[dependencies]
lsp-server = { workspace = true }
lsp-types = { workspace = true }
rocci-lsp = { workspace = true }
rocci-rocdown = { workspace = true }
serde_json = { workspace = true }
