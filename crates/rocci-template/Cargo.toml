[package]
name = "rocci-template"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Parse and lower .rocci templates to ordinary Roc"

[lib]
name = "rocci_template"
path = "src/lib.rs"

[[bin]]
name = "rocci-template"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }
