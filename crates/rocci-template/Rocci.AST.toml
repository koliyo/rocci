# Maps Rocci.AST.ungram productions onto shipped rocci-template types.
# Phase 1 documentation for codegen. Language crates do not parse this at runtime.

[meta]
ungram = "Rocci.AST.ungram"
uses = ["crate::span::Span"]

# Emit a struct or enum matching `rust`.
[generated]
Document = "rocci_template::Document"
ModuleItem = "rocci_template::ModuleItem"
ComponentDecl = "rocci_template::ComponentDecl"
FixtureDecl = "rocci_template::FixtureDecl"
CssDecl = "rocci_template::CssDecl"
ContextDecl = "rocci_template::ContextDecl"
InitDecl = "rocci_template::InitDecl"
OnDecl = "rocci_template::OnDecl"
TemplateBlock = "rocci_template::TemplateBlock"
TemplateItem = "rocci_template::TemplateItem"
Element = "rocci_template::Element"
ComponentCall = "rocci_template::ComponentCall"
ComponentPath = "rocci_template::ComponentPath"
Fragment = "rocci_template::Fragment"
TextNode = "rocci_template::TextNode"
Interpolation = "rocci_template::Interpolation"
Attr = "rocci_template::Attr"
AttrValue = "rocci_template::AttrValue"
IfDirective = "rocci_template::IfDirective"
ForDirective = "rocci_template::ForDirective"
MatchDirective = "rocci_template::MatchDirective"
MatchArm = "rocci_template::MatchArm"
LetDirective = "rocci_template::LetDirective"
Ident = "rocci_template::Ident"

# Production names a variant payload, not a standalone exported type.
[inline]
RocRegion = "ModuleItem::Roc { span }"
Static = "AttrValue::Static { span, value }"
Expr = "AttrValue::Expr { expr }"
Action = "AttrValue::Action { name, args }"
Boolean = "AttrValue::Boolean"
ElseIf = "IfDirective.else_ifs: Vec<(Span, TemplateBlock)>"

# Leaf `Name = 'token'` rust types. Do not guess.
[leaves]
RocRegion = "Span"
ParamList = "Span"
RocExpr = "Span"
RocType = "Span"
RocPattern = "Span"
CssPayload = "Span"
StringLit = "{ value: String, span: Span }"
Ident = "{ name: String, span: Span }"
TextNode = "{ value: String, span: Span }"

# Present on the shipped type but not a tree child from ungram labels.
[extra]
"Element.self_closing" = "bool"
"ComponentPath.roc_name" = "String"
"ComponentCall.children" = "Option<Vec<TemplateItem>> wrapping TemplateItem*"
"MatchArm.value" = "Box<TemplateItem>"
"OnDecl.path" = "String + path_span from StringLit"

[module_item_variants]
RocRegion = "Roc"
ComponentDecl = "Component"
FixtureDecl = "Fixture"
CssDecl = "Css"
ContextDecl = "Context"
InitDecl = "Init"
OnDecl = "On"

[template_item_variants]
Element = "Element"
ComponentCall = "ComponentCall"
Fragment = "Fragment"
TextNode = "Text"
Interpolation = "Interpolation"
IfDirective = "If"
ForDirective = "For"
MatchDirective = "Match"
LetDirective = "Let"
CssDecl = "Css"

[attr_value_variants]
Static = "Static"
Expr = "Expr"
Action = "Action"
Boolean = "Boolean"

[add_fields]
"Element.self_closing" = "bool"
"ComponentPath.roc_name" = "String"

[wrap]
"ComponentCall.children" = "Option"
"MatchArm.value" = "Box"

[flatten]
"OnDecl.path" = "path:String, path_span:Span"

[span_method]
TemplateItem = true

[out_of_tree]
ParsedParams = "derived from ParamList text; not a node"

# Inspect heads emitted by format_ast. Tags that are not the production name
# must be listed here. pprint.rs owns Writer and atom policy, not these names.
[inspect.tags]
Document = "module"
RocRegion = "roc"
ComponentDecl = "component"
ParamList = "params"
FixtureDecl = "fixture"
CssDecl = "css"
ContextDecl = "context"
InitDecl = "init"
OnDecl = "on"
Element = "element"
ComponentCall = "call"
Fragment = "fragment"
TextNode = "text"
Interpolation = "interp"
Attr = "attr"
IfDirective = "if"
ElseIf = "else-if"
ForDirective = "for"
MatchDirective = "match"
MatchArm = "arm"
LetDirective = "let"

[inspect.overlay]
RocRegion = "write_roc_region"
ComponentDecl = "write_component"
FixtureDecl = "write_fixture"
CssDecl = "write_css"
ContextDecl = "write_context"
InitDecl = "write_init"
OnDecl = "write_on"
Element = "write_element"
ComponentCall = "write_call"
Fragment = "write_fragment"
TextNode = "write_text"
Interpolation = "write_interp"
Attr = "write_attr"
AttrValue = "write_attr"
IfDirective = "write_if"
ElseIf = "write_if"
ForDirective = "write_for"
MatchDirective = "write_match"
MatchArm = "write_match"
LetDirective = "write_let"

[inspect.omit]
ModuleItem = "enum wrapper; variants print their own heads"
TemplateBlock = "items printed without a wrapper tag"
TemplateItem = "enum wrapper; variants print their own heads"
ComponentPath = "flattened onto call atoms"
AttrValue = "flattened onto attr"
Static = "printed as attr"
Expr = "printed as attr"
Action = "printed as attr"
Boolean = "printed as attr"
Ident = "atom; no inspect head"

[highlight.omit]
Ident = "atom; painted through parent spans"
Interpolation = "opaque RocExpr span"
TextNode = "plain text; not a host keyword"
