[package]
name = "rocci-wasi-http"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "WASI 0.3 HTTP adapter host for basic-webserver 0.16 Roc apps"

[lib]
name = "rocci_wasi_http"
path = "src/lib.rs"

[features]
default = ["map", "embedder"]
map = []
embedder = ["map", "dep:wasmtime", "dep:wat", "dep:rusqlite", "dep:tokio"]

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
wasmtime = { version = "48", features = ["async"], optional = true }
wat = { version = "1", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
