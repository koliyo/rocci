[package]
name = "rocci-playground-spike"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Phase 0 WASM compilation and parity spike for Rocci and Rocdown"
publish = false

[lib]
name = "rocci_playground_spike"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
rocci-template = { workspace = true }
rocci-rocdown = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
