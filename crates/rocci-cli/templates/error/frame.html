<section class="frame {{kind}}">
<div class="frame-head"><span class="pill">{{label}}</span> {{message}}</div>
<div class="loc">{{file}}:{{line}}:{{column}}</div>
<pre class="code"><span class="gutter">{{line}}</span><span class="src">{{source}}</span>
<span class="gutter"></span><span class="caret">{{caret}}</span></pre>
</section>
