[package]
name = "rocci-cli"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Command-line interface for Rocci configuration, packaging, and .rocci template compilation"

[lib]
name = "rocci_cli"
path = "src/lib.rs"

[[bin]]
name = "rocci"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
notify = { workspace = true }
rocci-core = { workspace = true }
rocci-worker-platform = { workspace = true }
rocci-datastar = { workspace = true, features = ["fetch"] }
rocci-highlight = { workspace = true }
rocci-roc-host = { workspace = true }
rocci-ui = { workspace = true }
rocci-theme = { workspace = true }
rocci-template = { workspace = true }
rocci-desktop = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
toml = { workspace = true }
toml_edit = "0.25"
tar = "0.4"
flate2 = "1.1"
wasmparser = "0.252"
ureq = "3.4"
