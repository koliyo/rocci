services:
  islands:
    build:
      context: ../..
      dockerfile: docker/runtime/Dockerfile
      target: islands
    environment:
      ROC_BASIC_WEBSERVER_HOST: "0.0.0.0"
      ROC_BASIC_WEBSERVER_PORT: "8001"
      DB_PATH: /var/lib/rocci/counter.db
    volumes:
      - counter-db:/var/lib/rocci
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 90s

  cdn:
    build:
      context: ../..
      dockerfile: docker/runtime/Dockerfile
      target: cdn
    ports:
      - "8080:80"
    depends_on:
      islands:
        condition: service_healthy

volumes:
  counter-db:
