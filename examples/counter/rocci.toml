[app]
name = "Counter"
identifier = "dev.rocci.counter"
version = "0.1.0"

[[windows]]
label = "main"
title = "Counter"
url = "/"
width = 1040
height = 760
min_width = 720
min_height = 560

[http]
host = "127.0.0.1"
port = 0

[security]
allowed_origins = []

[assets]
directory = "assets"
embed = true

[development]
reload = false
devtools = false

[bundle]
app = "."

[[bundle.resources]]
from = "assets"
to = "app/assets"
